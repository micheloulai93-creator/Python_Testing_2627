{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-5 border-0 shadow-lg rounded-4" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-5">
            <h1 class="fw-bold mb-2" style="color: var(--primary); font-size: 2rem;">Bienvenue</h1>
            <p class="text-muted">Connectez-vous pour gérer vos réservations</p>
        </div>
        
        <form action="{{ url_for('showSummary') }}" method="post">
            <div class="mb-4">
                <label for="email" class="form-label fw-medium text-muted small">Adresse e-mail</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="john@simplylift.co" required>
            </div>
            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-3">Se connecter</button>
            </div>
        </form>

        <!-- Lien vers le tableau public -->
        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-2">Vous n'êtes pas secrétaire de club ?</p>
            <a href="{{ url_for('points') }}" class="text-decoration-none fw-bold" style="color: var(--primary);">
                Consulter le tableau des points public
            </a>
        </div>
    </div>
</div>
{% endblock %}
