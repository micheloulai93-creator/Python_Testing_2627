{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
            <h3 class="text-center mb-4" style="color: #2c3e50;">Connexion</h3>
            <form action="{{ url_for('showSummary') }}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted">Adresse e-mail du club</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="ex: john@simplylift.co" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary-custom text-white">Se connecter</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
