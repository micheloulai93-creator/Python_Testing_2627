{% extends "base.html" %}
{% block title %}Booking for {{ competition['name'] }} || GUDLFT{% endblock %}
{% block nav %}<a class="nav-link" href="{{ url_for('logout') }}">Logout</a>{% endblock %}
{% block content %}
<h2>{{ competition['name'] }}</h2>
<p>Places available: {{ competition['numberOfPlaces'] }}</p>
<p class="points">Your points: {{ club['points'] }}</p>
<form action="{{ url_for('purchasePlaces') }}" method="post" class="card">
    <input type="hidden" name="club" value="{{ club['name'] }}">
    <input type="hidden" name="competition" value="{{ competition['name'] }}">
    <label for="places">How many places?</label>
    <input type="number" name="places" id="places" min="1" max="12" required/>
    <button type="submit">Book</button>
</form>
{% endblock %}
