{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4" style="color: #2c3e50;">Réserver des places</h3>
            <p class="text-center text-muted">Compétition : <strong>{{ competition.name }}</strong></p>
            <!-- Texte attendu par les tests -->
            <p class="text-center text-muted">Your points: {{ club.points }}</p>

            <form action="{{ url_for('purchasePlaces') }}" method="post">
                <input type="hidden" name="club" value="{{ club.name }}">
                <input type="hidden" name="competition" value="{{ competition.name }}">
                
                <div class="mb-3">
                    <label for="places" class="form-label text-muted">Nombre de places souhaitées</label>
                    <!-- Attributs min et max attendus par les tests -->
                    <input type="number" class="form-control form-control-lg" id="places" name="places" min="1" max="12" required>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary text-white">Confirmer la réservation</button>
                    <a href="{{ url_for('showSummary') }}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
