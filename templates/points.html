{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card card-custom p-4">
            <h3 class="text-center mb-4" style="color: #2c3e50;">Classement des clubs</h3>
            <table class="table table-hover table-custom">
                <thead>
                    <tr>
                        <th>Club</th>
                        <th class="text-end">Points</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in clubs %}
                    <tr>
                        <td class="align-middle">{{ c.name }}</td>
                        <td class="text-end align-middle fw-bold">{{ c.points }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
